# Publishes site/ as the organisation's GitHub Pages site,
# https://linlog-prover.github.io/, whose every address now redirects to
# deduxit.github.io (README). The files are static and nothing is built.
# Actions are pinned to full commit SHAs, with the version in a trailing
# comment, as the organisation requires.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  upload:
    name: Upload the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  # The only job given the rights to deploy Pages. One deployment at a time,
  # never cancelled midway.
  deploy:
    needs: upload
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
