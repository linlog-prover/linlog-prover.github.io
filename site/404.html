<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>linlog has moved to deduxit.github.io</title>
    <!-- GitHub Pages serves this page for every path that holds no file, at
         the path itself, so the script reads the old address and sends it to
         its new place, query and fragment kept:
           /linlog/…       linlog's rustdoc and manual, now the Pages site of
                           the repository deduxit/deduxit
           /rocq-linlog/…  the Rocq library's documentation, now the Pages
                           site of deduxit/rocq-deduxit, the library renamed
                           rocq-deduxit
           anything else   the web page's own paths, now the organisation
                           site deduxit.github.io -->
    <script>
      const SITE = "https://deduxit.github.io";
      const MOVED = [
        ["/linlog", "/deduxit"],
        ["/rocq-linlog", "/rocq-deduxit"],
      ];
      function moved(path) {
        for (const [old, now] of MOVED) {
          if (path === old || path.startsWith(old + "/")) return SITE + now + path.slice(old.length);
        }
        return SITE + path;
      }
      location.replace(moved(location.pathname) + location.search + location.hash);
    </script>
  </head>
  <body>
    <h1>linlog has moved</h1>
    <p>Everything that was here is now under deduxit.github.io:</p>
    <ul>
      <li><a href="https://deduxit.github.io/">the web page</a>, which proves step by step in the browser;</li>
      <li><a href="https://deduxit.github.io/deduxit/manual/">the manual</a> of the command;</li>
      <li><a href="https://deduxit.github.io/deduxit/linlog/">the library's API</a>;</li>
      <li><a href="https://deduxit.github.io/rocq-deduxit/">the Rocq library's documentation</a>;</li>
      <li><a href="https://github.com/deduxit/deduxit">the source</a>, on GitHub.</li>
    </ul>
  </body>
</html>
